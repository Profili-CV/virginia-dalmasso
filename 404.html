<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata · Virginia Dalmasso</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/virginia-dalmasso/favicon.svg?v=2" type="image/svg+xml">
<style>
@font-face { font-family: 'Inter Tight'; src: url('/virginia-dalmasso/fonts/inter-tight.woff2') format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'Hanken Grotesk'; src: url('/virginia-dalmasso/fonts/hanken.woff2') format('woff2'); font-weight: 100 900; }
:root { --paper: #FFFFFF; --ink: #26202A; --grey: #645B69; --accent: #6A2C9E; --blush: #F1ECF8; }
@media (prefers-color-scheme: dark) { :root { --paper: #1A161C; --ink: #EEEAF4; --grey: #B3A8B8; --accent: #B98CF0; --blush: #211C2B; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; background: var(--paper); color: var(--ink); font: 17px/1.6 'Hanken Grotesk', system-ui, sans-serif; text-align: center; overflow-x: clip; }
main { max-width: 560px; position: relative; }
.paper { position: relative; margin: 0 auto 18px; width: min(320px, 80vw); aspect-ratio: 4 / 3; border-radius: 6px; background: var(--blush); display: grid; place-items: center; overflow: hidden; }
.paper b { font: 900 clamp(80px, 22vw, 130px)/1 'Inter Tight', sans-serif; letter-spacing: -0.05em; color: var(--accent); }
.scratch { position: absolute; inset: 0; }
.scratch path { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 120; stroke-dashoffset: 120; animation: claw .5s .6s ease-out forwards; }
.scratch path:nth-child(2) { animation-delay: .7s; } .scratch path:nth-child(3) { animation-delay: .8s; }
.cat { position: absolute; right: -10px; bottom: -6px; width: 120px; transform: scaleX(-1); }
h1 { margin: 0 0 8px; font: 800 26px/1.2 'Inter Tight', sans-serif; letter-spacing: -0.01em; }
p { margin: 0 0 6px; color: var(--grey); }
.en { font-size: 15px; }
a.btn { display: inline-flex; align-items: center; gap: 10px; margin-top: 26px; min-height: 52px; padding: 0 24px; border-radius: 999px; background: var(--ink); color: var(--paper); font-weight: 600; text-decoration: none; }
a.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
@keyframes claw { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .scratch path { animation: none; stroke-dashoffset: 0; } }
</style>
</head>
<body>
<main>
  <div class="paper" aria-hidden="true">
    <b>404</b>
    <svg class="scratch" viewBox="0 0 320 240" preserveAspectRatio="none"><path d="M120 40 C140 100 150 150 140 210"/><path d="M150 30 C172 95 182 150 170 215"/><path d="M180 38 C202 100 210 150 198 208"/></svg>
    <img class="cat" src="/virginia-dalmasso/img/gatto.png" alt="">
  </div>
  <h1>Il gatto si è fatto le unghie su questa pagina.</h1>
  <p>Non esiste più, o il link ha un errore di battitura.</p>
  <p class="en">The cat sharpened its claws on this page: it no longer exists, or the link is mistyped.</p>
  <a class="btn" href="/virginia-dalmasso/">Torna al sito · Back to the site <span aria-hidden="true">→</span></a>
</main>
</body>
</html>
